[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mti-tool"
version = "0.1.0"
description = "MTI 翻译实践小助手 — Translation & Report Copilot"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Xue Yang"}
]

[tool.setuptools.packages.find]
include = ["mti_tool*", "eval*"]
